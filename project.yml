name: AppLockPro
options:
  bundleIdPrefix: com.applockpro
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: "AppLock Pro"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: "Manual"

targets:
  AppLockPro:
    type: application
    platform: macOS
    sources:
      - path: AppLockPro
        excludes:
          - "**/.DS_Store"
          - "**/*.tar.gz"
          - "AI/Models/**"
      - path: AppLockPro/AI/Models/ArcFaceModel.mlmodelc
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.applockpro.facelockpro
        INFOPLIST_FILE: AppLockPro/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppLockPro/App/AppLockPro.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: AppLockPro/App/AppLockPro.entitlements
      properties:
        com.apple.security.device.camera: true
